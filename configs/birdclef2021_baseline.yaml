seed: 42
data:
  metadata_csv: data/processed/birdclef-2021/metadata.csv
  audio_root: data/raw/birdclef-2021/train_short_audio
  label_map: data/processed/birdclef-2021/label_map.json
  sample_rate: 32000
  clip_seconds: 5.0
  validation_fraction: 0.2
  split_strategy: stratified
audio:
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  f_min: 80
  f_max: 14000
model: {width: 32, dropout: 0.25}
training:
  batch_size: 24
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  output_dir: artifacts/birdclef2021_baseline
