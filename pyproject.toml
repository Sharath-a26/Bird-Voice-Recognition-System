[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "birdvoice"
version = "0.1.0"
description = "Reproducible bird vocalization recognition"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "PyYAML>=6.0", "scikit-learn>=1.3", "torch>=2.2", "torchaudio>=2.2", "tqdm>=4.66", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
birdvoice-train = "birdvoice.train:main"
birdvoice-infer = "birdvoice.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
